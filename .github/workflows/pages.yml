---
name: Pages

# Two static sites, two Cloudflare Pages projects, one shared core:
#   dist/coffee -> bean-book  (coffee.ravensberg.org)
#   dist/tea    -> leaf-book  (tea.ravensberg.org)
#
# Reviews are re-fetched from published GitHub Issues on every run, so
# publishing, unpublishing or editing an issue is the whole state machine —
# there is no "already processed" marker. `BUILD_GITHUB_TOKEN` is only exposed
# to production builds; pull request previews build from the committed sample
# fixtures instead.

# TODO: `BUILD_GITHUB_TOKEN` is added by DevSecNinja/.github PR
# "feat(pages): add opt-in BUILD_GITHUB_TOKEN for production builds". Bump both
# `uses:` pins below to that release before merging, or the runs will fail with
# an invalid-secret error.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed
    paths-ignore:
      - "**.md"
  # Rebuild when reviews are published/unpublished or edited.
  issues:
    types: [closed, reopened, labeled, unlabeled, edited, deleted]
  # Daily refresh so edits to already-published issues eventually show up.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bean-book:
    name: Bean Book (coffee)
    uses: DevSecNinja/.github/.github/workflows/pages.yml@783a7a3a03ae71efcdf5b13eaea80efe26dfa641 # v2.2.0
    permissions:
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      # renovate: datasource=node-version depName=node
      node-version: "24"
      node-cache: npm
      # renovate: datasource=npm depName=wrangler
      wrangler-version: "4.116.0"
      github-pages: false
      cloudflare-production: true
      cloudflare-project-name: bean-book
      artifact-path: dist/coffee
      build-command: npm run build:coffee
      test-command: npm test
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Scoped by this job's `permissions:` above — read-only, issues included.
      BUILD_GITHUB_TOKEN: ${{ github.token }}

  leaf-book:
    name: Leaf Book (tea)
    uses: DevSecNinja/.github/.github/workflows/pages.yml@783a7a3a03ae71efcdf5b13eaea80efe26dfa641 # v2.2.0
    permissions:
      contents: read
      deployments: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      # renovate: datasource=node-version depName=node
      node-version: "24"
      node-cache: npm
      # renovate: datasource=npm depName=wrangler
      wrangler-version: "4.116.0"
      github-pages: false
      cloudflare-production: true
      cloudflare-project-name: leaf-book
      artifact-path: dist/tea
      build-command: npm run build:tea
      # The suite is shared and already runs in the bean-book job above.
      test-command: ""
      preview-comment-marker: "<!-- cf-preview-comment-leaf-book -->"
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BUILD_GITHUB_TOKEN: ${{ github.token }}
